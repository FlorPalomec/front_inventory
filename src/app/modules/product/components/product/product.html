<mat-card>
    <h2 class="alinear">Listado de Productos</h2>

    <mat-card-header>
        <div>
            <mat-form-field hintLabel="Busqueda Productos" appearance="fill">
                <mat-label>Buscar productos</mat-label>
                <input matInput #input>
            </mat-form-field>
        </div>
    </mat-card-header>

    <mat-card-header>
        <div class="right">
            <ul>
                <li>
                    <button mat-raised-button color="primary" (click)="agregarProducto()">
                        Agregar Producto
                    </button>
                </li>
            </ul>
        </div>
    </mat-card-header>

    <div mat-card-image>
        <mat-card-content>

            <table mat-table [dataSource]="dataSource">
                <!-- ID -->
                <ng-container matColumnDef="id">
                    <th mat-header-cell *matHeaderCellDef>No</th>
                    <td mat-cell *matCellDef="let element">
                        {{ element.id }}
                    </td>
                </ng-container>

                <!-- DISPONIBLES -->
                <ng-container matColumnDef="account">
                    <th mat-header-cell *matHeaderCellDef>Disponibles</th>
                    <td mat-cell *matCellDef="let element">{{ element.account }}</td>
                </ng-container>

                <!-- NOMBRE -->
                <ng-container matColumnDef="name">
                    <th mat-header-cell *matHeaderCellDef>Nombre</th>
                    <td mat-cell *matCellDef="let element">{{ element.name }}</td>
                </ng-container>

               <!-- IMAGEN -->
<ng-container matColumnDef="picture">

    <th mat-header-cell *matHeaderCellDef>
        Imagen
    </th>

    <td mat-cell *matCellDef="let element">

        <img
          [src]="'assets/img/' + element.picture"
          width="80"
          height="80"
          alt="Producto"
        >

    </td>

</ng-container>

                <!-- PRECIO -->
                <ng-container matColumnDef="price">
                    <th mat-header-cell *matHeaderCellDef>Precio</th>
                    <td mat-cell *matCellDef="let element">{{ element.price }}</td>
                </ng-container>

                <!-- CATEGORIA -->
                <ng-container matColumnDef="category_id">
                    <th mat-header-cell *matHeaderCellDef>Categoría</th>
                    <td mat-cell *matCellDef="let element">{{ element.category_id }}</td>
                </ng-container>

                <!--Actions-->
                <ng-container matColumnDef="actions">
                    <th mat-header-cell *matHeaderCellDef>Acciones</th>
                    <td mat-cell *matCellDef="let element; let i=index;">
                    <button mat-icon-button color="accent">
                        <mat-icon aria-label="Edit" (click)="editarProducto(element)">edit</mat-icon>
                    </button>
                    <button mat-icon-button color="accent">
                        <mat-icon aria-label="Delete" (click)="eliminarProducto(element.id)">delete</mat-icon>
                    </button>
                    </td>

                </ng-container>
                <tr mat-header-row *matHeaderRowDef="displayColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayColumns;"></tr>
            </table>
        </mat-card-content>
    </div>
</mat-card>
